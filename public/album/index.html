<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Álbum - Previsualización</title>
  <style>
    :root {
        color-scheme: light;
        --bg: #f7efe5;
        --panel: #fffdf8;
        --panel-2: #f2e5d0;
        --text: #2f2a22;
        --muted: #6d6256;
        --accent: #5c7a3a;
        --accent-2: #8c5a2b;
        --border: rgba(87, 66, 43, 0.12);
    }

    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
        margin: 0;
        font-family: Inter, "Segoe UI", Roboto, Arial, sans-serif;
        background: linear-gradient(135deg, #f9f2e7 0%, #e7f0dc 100%);
        color: var(--text);
        min-height: 100vh;
        padding: 0;
    }

    a { color: inherit; text-decoration: none; }

    /* Topbar */
    .topbar {
        position: sticky;
        top: 0;
        z-index: 40;
        background: rgba(255,253,248,0.95);
        border-bottom: 1px solid var(--border);
    }

    .topbar-inner {
        max-width: 1120px;
        margin: 0 auto;
        padding: 0.6rem 1rem;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 1rem;
    }

    .brand { display: inline-flex; align-items:center; gap:0.75rem; font-weight:800; }
    .brand img { width:40px; height:40px; border-radius:50%; object-fit:cover; }

    .nav-links { display:flex; gap:0.8rem; }
    .nav-links a { padding:0.35rem 0.75rem; border-radius:8px; color:var(--muted); font-weight:700; }
    .nav-links a.active, .nav-links a:hover { background: rgba(92,122,58,0.12); color:var(--accent); }

    .container { max-width: 1120px; margin: 0 auto; padding: 1.25rem; }

    h1{margin:0 0 1rem;padding-top:0.5rem}

    /* Gallery grid adapted to theme */
    .grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:1rem;margin-top:1rem}
    .card{background:var(--panel);border:1px solid var(--border);border-radius:18px;overflow:hidden;box-shadow:0 12px 32px rgba(87,66,43,0.06);height:220px}
    .card img, .card video{width:100%;height:100%;object-fit:cover;display:block}
    .card video{background:#000}

    @media (max-width:980px){ .grid{grid-template-columns:repeat(2,minmax(0,1fr))} }
    @media (max-width:580px){ .grid{grid-template-columns:1fr} .card{height:200px} }

    /* Lightbox styling similar to layout */
    .lightbox{ position:fixed; inset:0; display:none; background: rgba(0,0,0,0.92); align-items:center; justify-content:center; z-index:9999; padding:1.5rem; }
    .lightbox.open{ display:flex }
    .lightbox .content{ max-width: 90vw; max-height: 90vh; width:100%; display:flex; align-items:center; justify-content:center; position:relative; box-sizing:border-box; padding:1rem }
    .lightbox img, .lightbox video{ max-width: calc(90vw - 2rem); max-height: calc(90vh - 2rem); border-radius:12px; box-shadow: 0 24px 60px rgba(0,0,0,0.35); object-fit: contain; border:8px solid rgba(255,255,255,0.06); background:#000 }
    .lightbox-close{ position:absolute; top:1rem; right:1rem; z-index:10010; border:none; background:rgba(255,255,255,0.06); color:#fff; width:44px; height:44px; border-radius:50%; font-size:1.4rem }
    .lightbox-nav{ position:absolute; top:50%; transform:translateY(-50%); width:56px; height:56px; border-radius:50%; background: rgba(255,255,255,0.06); color:#fff; border:none; display:flex; align-items:center; justify-content:center; font-size:1.6rem; z-index:10009 }
    .lightbox-nav.prev{ left:1rem }
    .lightbox-nav.next{ right:1rem }
    .lightbox-nav:hover, .lightbox-close:hover{ background: rgba(255,255,255,0.12) }
    @media (max-width:580px){ .lightbox-nav{ width:44px;height:44px;font-size:1.25rem } .lightbox img,.lightbox video{ border:6px solid rgba(255,255,255,0.06) }}
  </style>
</head>
  <body>
  <header class="topbar">
    <div class="topbar-inner">
      <a href="..\" class="brand">
        <img src="..\public\images\ep33.jpg" alt="EP33">
        <span>E.P. N°33 Horacio Rega Molina</span>
      </a>
      <nav class="nav-links">
        <a href="..\">Inicio</a>
        <a href="#" class="active">Álbum</a>
      </nav>
    </div>
  </header>

  <main class="container">
    <h1>Álbum — Previsualización</h1>
    <div id="gallery" class="grid"></div>
  <div id="lb" class="lightbox" role="dialog" aria-hidden="true">
    <button class="lightbox-close" aria-label="Cerrar">✕</button>
    <button class="lightbox-nav prev" aria-label="Anterior">‹</button>
    <div class="content"></div>
    <button class="lightbox-nav next" aria-label="Siguiente">›</button>
  </div>

    </main>

  <script>
    const files = [
"001_video.mp4","002_ep33.jpg","003_1.jpg","004_2.jpg","005_3.jpg","006_4.jpg","007_5.jpg","008_6.jpg","009_7.jpg","010_8.jpg","011_9.jpg","012_10.jpg","013_11.jpg","014_12.jpg","015_13.jpg","016_14.jpg","017_15.jpg","018_plantando.jpeg","019_17.jpg","020_18.jpg","021_19.jpg","022_20.jpg","023_21.jpg","024_22.jpg","025_23.jpg","026_24.jpg","027_25.jpg","028_26.jpg","029_27.jpg","030_28.jpg","031_29.jpg","032_30.jpg","033_31.jpg","034_32.jpg","035_33.jpg","036_34.jpg","037_35.jpg","038_36.jpg","039_37.jpg","040_38.jpg","041_39.jpg","042_40.jpg","043_41.jpg","044_42.jpg","045_43.jpg","046_44.jpg","047_45.jpg","048_46.jpg","049_47.jpg","050_48.jpg","051_49.jpg","052_50.jpg","053_rabanito1.jpeg","054_rabanito2.jpeg","055_videoaguadeajo.mp4","056_qr1.jpeg","057_qr2.jpeg","058_qr3.jpeg","059_qr4.jpeg","060_qr5.jpeg","061_qr6.jpeg","062_qr7.jpeg","063_qr8.jpeg","064_qr9.jpeg","065_qr10.jpeg","066_qr11.jpeg","067_qr12.jpeg","068_qr13.jpeg","069_qr14.jpeg","070_qr15.jpeg","071_qr16.jpeg","072_qr17.jpeg","073_qr18.jpeg","074_qr19.jpeg","075_qr20.jpeg","076_qr21.jpeg","077_qr22.jpeg","078_qr23.jpeg","079_qr24.jpeg","080_qr25.jpeg","081_n1.jpeg","082_n2.jpeg","083_n3.jpeg","084_n4.jpeg","085_n5.jpeg","086_n6.jpeg","087_n7.jpeg","088_n8.jpeg","089_n9.jpeg","090_n10.jpeg"
    ];

    const gallery = document.getElementById('gallery');
    files.forEach(name => {
      const ext = name.split('.').pop().toLowerCase();
      const card = document.createElement('div');
      card.className = 'card';
      if (ext === 'mp4') {
        const v = document.createElement('video');
        v.preload = 'metadata'; v.src = name; v.muted = true; v.loop = true; v.autoplay = true; v.playsInline = true;
        card.appendChild(v);
      } else {
        const i = document.createElement('img');
        i.src = name; i.alt = '';
        card.appendChild(i);
      }
      // Lightbox on click (no descriptions shown)
      card.addEventListener('click', ()=> openLightbox(name, ext));
      gallery.appendChild(card);
    });

    const lb = document.getElementById('lb');
    const lbContent = lb.querySelector('.content');
    const lbClose = lb.querySelector('.lightbox-close');
    const lbPrev = lb.querySelector('.lightbox-nav.prev');
    const lbNext = lb.querySelector('.lightbox-nav.next');
    let currentIndex = -1;

    function showAt(index){
      if (index < 0) index = files.length - 1;
      if (index >= files.length) index = 0;
      currentIndex = index;
      const name = files[currentIndex];
      const ext = name.split('.').pop().toLowerCase();
      lbContent.innerHTML = '';
      if (ext === 'mp4'){
        const v = document.createElement('video');
        v.controls = true;
        v.src = name;
        v.autoplay = true;
        v.playsInline = true;
        // Special sizing for the root video (001_video.mp4) to avoid full-stretch
        if (name.toLowerCase().endsWith('001_video.mp4') || name === '001_video.mp4') {
          v.style.maxWidth = '70vw';
          v.style.maxHeight = '70vh';
        } else {
          v.style.maxWidth = '100%';
          v.style.maxHeight = '100%';
        }
        lbContent.appendChild(v);
      } else {
        const i = document.createElement('img'); i.src = name; i.alt = ''; lbContent.appendChild(i);
      }
      lb.classList.add('open'); lb.setAttribute('aria-hidden','false');
    }
    function openLightbox(name, ext){
      const idx = files.indexOf(name);
      if (idx === -1) return showAt(0);
      showAt(idx);
    }
    function closeLightbox(){ lb.classList.remove('open'); lb.setAttribute('aria-hidden','true'); lbContent.innerHTML=''; }
    lbClose.addEventListener('click', closeLightbox);
    lbPrev.addEventListener('click', (e)=>{ e.stopPropagation(); showAt(currentIndex - 1); });
    lbNext.addEventListener('click', (e)=>{ e.stopPropagation(); showAt(currentIndex + 1); });
    lb.addEventListener('click', (e)=>{ if (e.target === lb) closeLightbox(); });
    document.addEventListener('keydown', (e)=>{ if (e.key==='Escape') closeLightbox(); else if (e.key==='ArrowLeft') showAt(currentIndex - 1); else if (e.key==='ArrowRight') showAt(currentIndex + 1); });
  </script>
</body>
</html>
